// ================= AI model =================
class Net{constructor(){this.w1=Array.from({length:8},()=>Array.from({length:5},()=>rnd(-.5,.5)));this.b1=Array(8).fill(0);this.w2=Array.from({length:8},()=>rnd(-.5,.5));this.b2=0}
 fwd(x){const h=this.w1.map((w,j)=>Math.tanh(w.reduce((s,v,i)=>s+v*x[i],this.b1[j])));return{h,o:sig(h.reduce((s,v,j)=>s+v*this.w2[j],this.b2))}}
 pred(x){return this.fwd(x).o}
 train(x,y,lr){const{h,o}=this.fwd(x),d=o-y;for(let j=0;j<8;j++){const dh=d*this.w2[j]*(1-h[j]*h[j]);this.w2[j]-=lr*d*h[j];for(let i=0;i<5;i++)this.w1[j][i]-=lr*dh*x[i];this.b1[j]-=lr*dh}this.b2-=lr*d}}
const truth=f=>sig(3.2*f[0]+3*f[1]+2.2*f[2]+1.5*f[3]*(f[1]+.3)+2.8*f[4]*f[0]-4.6);
const net=new Net();for(let e=0;e<40;e++)for(let s=0;s<2000;s++){const x=[0,0,0,0,0].map(()=>rnd());net.train(x,c01(truth(x)+rnd(-.03,.03)),.05)}

 return m<360?[0,tr("f"),t]:m<1440?[1,tr("s"),t]:[3,tr("o"),t]}

 $("tiles").innerHTML=DATA.stats.map(s=>`<div class="tile"><b>${esc(s.v)}</b><span>${esc(s.l[lang])}</span></div>`).join("");

 const sel=$("pre"),cur=sel.value;sel.innerHTML=`<option value="">${tr("cus")}</option>`+P.map((p,i)=>`<option value="${i}">${lang==="th"?p[1]:p[0]}</option>`).join("");sel.value=cur;

 const f=feats(),r=net.pred(f),l=lvl(r),C=2*Math.PI*66;
 const dr=f.map((_,i)=>{const g=f.slice();g[i]=0;return[tr("f"+i).split(" (")[0],r-net.pred(g)]}).sort((a,b)=>b[1]-a[1]).slice(0,2);

const KB=[{k:["ท่วม","สาเหตุ","ทำไม","cause","why","flood"],th:"น้ำท่วมใหญ่ครั้งนี้เกิดจากหย่อมความกดอากาศต่ำกำลังแรงร่วมกับมรสุมตะวันตกเฉียงใต้ ทำให้ฝนตกหนักต่อเนื่อง ประกอบกับพื้นที่ลุ่มต่ำ ดินอิ่มน้ำ คลองระบายไม่ทัน และน้ำเหนือจากลุ่มเจ้าพระยา",en:"This flood came from a strong low-pressure system plus the southwest monsoon, causing days of heavy rain. Low-lying land, saturated soil, canals that can't drain fast enough and northern runoff down the Chao Phraya add to it."},
{k:["ไฟ","ปลั๊ก","electric","power","outlet"],th:"ห้ามแตะเสาไฟ ปลั๊ก หรืออุปกรณ์ไฟฟ้าขณะยืนในน้ำ ปิดสวิตช์ไฟหลักจากจุดที่แห้งและปลอดภัยก่อนน้ำเข้า หากไฟรั่วหรือมีคนถูกไฟดูด โทร 1669 อย่าเข้าไปช่วยด้วยมือเปล่า และให้ช่างไฟตรวจก่อนเปิดไฟอีกครั้ง",en:"Never touch poles, outlets or electrical devices while standing in water. Switch off the main power from a dry, safe spot before water enters. If someone is shocked call 1669 and don't touch them directly; have an electrician check wiring before power is restored."},

function offline(q){const t=q.toLowerCase();if(/ตอนนี้|สถานการณ์|ถนน|ล่าสุด|now|situation|road|latest|today/.test(t))return snap()+"\n\n"+(lang==="th"?"(ข้อมูลอัปเดต ":"(Data updated ")+DATA.updated.slice(0,16).replace("T"," ")+")";

const INSTR="You are the Flood & Science Assistant of Rachata Flood AI, a portal about Thailand floods. Rules: reply in the language of the user's question (Thai or English). Lead with a direct answer in 1-2 sentences, then at most 5 short bullet points starting with '- '. No headings. Be accurate and calm; use plain words. For current-situation questions use ONLY the snapshot below, name the source and date, and say it may have changed since. If the snapshot lacks the answer, say so and point to official sources (BMA dds.bangkok.go.th, TMD tmd.go.th, RID rid.go.th, DDPM disaster.go.th). For safety questions end with the emergency numbers: 1669 medical, 191 police, 1784 DDPM, 1555 BMA. For science questions (hydrology, meteorology, climate, dams, drainage) explain clearly and correctly. Never invent figures. Keep under 180 words unless asked.";
let sf=null,turns=[],ctl=null;

function add(c,t){const d=document.createElement("div");d.className=c;if(c==="u")d.textContent=t;else d.innerHTML=fmt(t);$("chat").appendChild(d);$("chat").scrollTop=1e9;return d}
async function ask(q){q=q.trim();if(!q)return;$("q").value="";add("u",q);const b=add("b",tr("think"));
 if(sf){ctl=new AbortController();$("send").style.display="none";$("stop").style.display="";

   b.innerHTML=fmt(r.text);turns.push({role:"user",content:q},{role:"assistant",content:r.text})}
  catch(e){b.innerHTML=fmt(e.code==="cancelled"?(e.text||"")+" ...":(e.text?e.text+"\n\n":"")+offline(q))}
  $("send").style.display="";$("stop").style.display="none";ctl=null}else b.innerHTML=fmt(offline(q));$("chat").scrollTop=1e9}
